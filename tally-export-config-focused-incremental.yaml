master:
  - name: mst_group
    collection: Group
    nature: Primary
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: name
        field: Name
        type: text
      - name: parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Parent
        type: text
      - name: _parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Guid:Group:$Parent
        type: text
      - name: primary_group
        field: _PrimaryGroup
        type: text
      - name: is_revenue
        field: IsRevenue
        type: logical
      - name: is_deemedpositive
        field: IsDeemedPositive
        type: logical
      - name: is_reserved
        field: IsReserved
        type: logical
      - name: affects_gross_profit
        field: AffectsGrossProfit
        type: logical
      - name: sort_position
        field: SortPosition
        type: number
    cascade_update:
      - table: mst_group
        field: parent
      - table: mst_ledger
        field: parent
  - name: mst_ledger
    collection: Ledger
    nature: Primary
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: name
        field: Name
        type: text
      - name: parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Parent
        type: text
      - name: _parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Guid:Group:$Parent
        type: text
      - name: alias
        field: OnlyAlias
        type: text
      - name: description
        field: Description
        type: text
      - name: notes
        field: Narration
        type: text
      - name: is_revenue
        field: IsRevenue
        type: logical
      - name: is_deemedpositive
        field: IsDeemedPositive
        type: logical
      - name: opening_balance
        field: OpeningBalance
        type: amount
      - name: closing_balance
        field: ClosingBalance
        type: amount
      - name: mailing_name
        field: MailingName
        type: text
      - name: mailing_address
        field: if $$IsEmpty:$Address then "" else $$FullList:Address:$Address
        type: text
      - name: mailing_state
        field: LedStateName
        type: text
      - name: mailing_country
        field: CountryName
        type: text
      - name: mailing_pincode
        field: PinCode
        type: text
      - name: email
        field: Email
        type: text
      - name: mobile
        field: if NOT $$IsEmpty:$LedgerMobile then $$Sprintf:"%s %s":$LedgerCountryISDCode:$LedgerMobile else ""
        type: text
      - name: it_pan
        field: IncomeTaxNumber
        type: text
      - name: gstn
        field: if $$IsEmpty:$PartyGSTIN then $LedGSTRegDetails[Last].GSTIN else $PartyGSTIN
        type: text
      - name: gst_registration_type
        field: if $$IsEmpty:$Gstregistrationtype then $LedGSTRegDetails[Last].Gstregistrationtype else $Gstregistrationtype
        type: text
      - name: gst_supply_type
        field: Gsttypeofsupply
        type: text
      - name: gst_duty_head
        field: Gstdutyhead
        type: text
      - name: bank_account_holder
        field: Bankaccholdername
        type: text
      - name: bank_account_number
        field: BankDetails
        type: text
      - name: bank_ifsc
        field: Ifscode
        type: text
      - name: bank_swift
        field: Swiftcode
        type: text
      - name: bank_name
        field: Bankingconfigbank
        type: text
      - name: bank_branch
        field: BankBranchname
        type: text
      - name: bill_credit_period
        field: $$Number:$BillCreditPeriod
        type: number
    cascade_update:
      - table: trn_accounting
        field: ledger
      - table: trn_bill
        field: ledger
  - name: mst_vouchertype
    collection: VoucherType
    nature: Primary
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: name
        field: Name
        type: text
      - name: parent
        field: Parent
        type: text
      - name: _parent
        field: $Guid:VoucherType:$Parent
        type: text
      - name: numbering_method
        field: NumberingMethod
        type: text
      - name: is_deemedpositive
        field: IsDeemedPositive
        type: logical
      - name: affects_stock
        field: AffectsStock
        type: logical
    cascade_update:
      - table: mst_vouchertype
        field: parent
      - table: trn_voucher
        field: voucher_type
  - name: mst_uom
    collection: Unit
    nature: Primary
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: name
        field: Symbol
        type: text
      - name: formalname
        field: FormalName
        type: text
      - name: is_simple_unit
        field: IsSimpleUnit
        type: logical
      - name: base_units
        field: BaseUnits
        type: text
      - name: additional_units
        field: AdditionalUnits
        type: text
      - name: conversion
        field: Conversion
        type: number
    cascade_update:
      - table: mst_stock_item
        field: uom
  - name: mst_godown
    collection: Godown
    nature: Primary
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: name
        field: Name
        type: text
      - name: parent
        field: Parent
        type: text
      - name: _parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Guid:Godown:$Parent
        type: text
      - name: address
        field: if $$IsEmpty:$Address then "" else $$FullList:Address:$Address
        type: text
    cascade_update:
      - table: mst_godown
        field: parent
      - table: mst_opening_batch_allocation
        field: godown
      - table: trn_inventory
        field: godown
      - table: trn_batch
        field: godown
      - table: trn_batch
        field: destination_godown
  - name: mst_stock_category
    collection: StockCategory
    nature: Primary
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: name
        field: Name
        type: text
      - name: parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Parent
        type: text
      - name: _parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Guid:StockCategory:$Parent
        type: text
    cascade_update:
      - table: mst_stock_item
        field: category
  - name: mst_stock_group
    collection: StockGroup
    nature: Primary
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: name
        field: Name
        type: text
      - name: parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Parent
        type: text
      - name: _parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Guid:StockGroup:$Parent
        type: text
    cascade_update:
      - table: mst_stock_group
        field: parent
      - table: mst_stock_item
        field: parent
  - name: mst_stock_item
    collection: StockItem
    nature: Primary
    fetch:
      - GstDetails,PartNo
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: name
        field: Name
        type: text
      - name: parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Parent
        type: text
      - name: _parent
        field: if $$IsEqual:$Parent:$$SysName:Primary then "" else $Guid:StockGroup:$Parent
        type: text
      - name: category
        field: if $$IsEqual:$Category:$$SysName:NotApplicable then "" else $Category
        type: text
      - name: _category
        field: if $$IsEqual:$Category:$$SysName:NotApplicable then "" else $Guid:StockCategory:$Parent
        type: text
      - name: alias
        field: OnlyAlias
        type: text
      - name: description
        field: Description
        type: text
      - name: notes
        field: Narration
        type: text
      - name: part_number
        field: PartNo
        type: text
      - name: uom
        field: if $$IsEqual:$BaseUnits:$$SysName:NotApplicable then "" else $BaseUnits
        type: text
      - name: _uom
        field: $Guid:Unit:$BaseUnits
        type: text
      - name: alternate_uom
        field: if $$IsEqual:$AdditionalUnits:$$SysName:NotApplicable then "" else $AdditionalUnits
        type: text
      - name: _alternate_uom
        field: $Guid:Unit:$AdditionalUnits
        type: text
      - name: conversion
        field: Conversion
        type: number
      - name: opening_balance
        field: OpeningBalance
        type: quantity
      - name: opening_rate
        field: OpeningRate
        type: rate
      - name: opening_value
        field: OpeningValue
        type: amount
      - name: closing_balance
        field: ClosingBalance
        type: quantity
      - name: closing_rate
        field: ClosingRate
        type: rate
      - name: closing_value
        field: ClosingValue
        type: amount
      - name: costing_method
        field: CostingMethod
        type: text
      - name: gst_type_of_supply
        field: GSTMSTTypeofSupply
        type: text
      - name: gst_hsn_code
        field: InfGSTHSNCode
        type: text
      - name: gst_hsn_description
        field: InfGSTHSNDescription
        type: text
      - name: gst_rate
        field: InfGSTIGSTRate
        type: number
      - name: gst_taxability
        field: InfGSTTaxablility
        type: text
    cascade_update:
      - table: trn_inventory
        field: item
      - table: trn_batch
        field: item
    cascade_delete:
      - table: mst_opening_batch_allocation
        field: _item
  - name: mst_opening_batch_allocation
    collection: StockItem.BatchAllocations
    nature: Derived
    fields:
      - name: name
        field: BatchName
        type: text
      - name: item
        field: ..Name
        type: text
      - name: _item
        field: $Guid:StockItem:$..Name
        type: text
      - name: opening_balance
        field: OpeningBalance
        type: quantity
      - name: opening_rate
        field: OpeningRate
        type: rate
      - name: opening_value
        field: OpeningValue
        type: amount
      - name: godown
        field: GodownName
        type: text
      - name: _godown
        field: $Guid:Godown:$GodownName
        type: text
      - name: manufactured_on
        field: MfdOn
        type: date
transaction:
  - name: trn_voucher
    collection: Voucher
    nature: Primary
    fetch:
      - AlterId,Narration,PartyLedgerName,PlaceOfSupply,Reference,ReferenceDate
    filters:
      - NOT $IsCancelled
      - NOT $IsOptional
    fields:
      - name: guid
        field: Guid
        type: text
      - name: alterid
        field: AlterId
        type: number
      - name: date
        field: Date
        type: date
      - name: voucher_type
        field: VoucherTypeName
        type: text
      - name: _voucher_type
        field: $Guid:VoucherType:$VoucherTypeName
        type: text
      - name: voucher_number
        field: VoucherNumber
        type: text
      - name: reference_number
        field: Reference
        type: text
      - name: reference_date
        field: ReferenceDate
        type: date
      - name: narration
        field: Narration
        type: text
      - name: party_name
        field: PartyLedgerName
        type: text
      - name: _party_name
        field: if $$IsEmpty:$PartyLedgerName then "" else $Guid:Ledger:$PartyLedgerName
        type: text
      - name: place_of_supply
        field: PlaceOfSupply
        type: text
      - name: is_invoice
        field: IsInvoice
        type: logical
      - name: is_accounting_voucher
        field: if $$IsAccountingVch:$VoucherTypeName then 1 else 0
        type: logical
      - name: is_inventory_voucher
        field: if $$IsInventoryVch:$VoucherTypeName then 1 else 0
        type: logical
      - name: is_order_voucher
        field: if $$IsOrderVch:$VoucherTypeName then 1 else 0
        type: logical
    cascade_delete:
      - table: trn_accounting
        field: guid
      - table: trn_inventory
        field: guid
      - table: trn_bill
        field: guid
      - table: trn_batch
        field: guid
  - name: trn_accounting
    collection: Voucher.AllLedgerEntries
    nature: Derived
    fetch:
      - AllLedgerEntries
    filters:
      - NOT $IsCancelled
      - NOT $IsOptional
    fields:
      - name: guid
        field: Guid
        type: text
      - name: ledger
        field: LedgerName
        type: text
      - name: _ledger
        field: $Guid:Ledger:$LedgerName
        type: text
      - name: amount
        field: Amount
        type: amount
      - name: amount_forex
        field: >-
          if $$IsEmpty:$$ForexValue:$Amount then 0 else $$StringFindAndReplace:(if $$IsDebit:$Amount then
          -$$ForexValue:$Amount else $$ForexValue:$Amount):"(-)":"-"
        type: amount
      - name: currency
        field: $$Currency:$Amount
        type: text
  - name: trn_inventory
    collection: Voucher.AllInventoryEntries
    nature: Derived
    fetch:
      - AllInventoryEntries
    filters:
      - NOT $IsCancelled
      - NOT $IsOptional
    fields:
      - name: guid
        field: Guid
        type: text
      - name: item
        field: StockItemName
        type: text
      - name: _item
        field: $Guid:StockItem:$StockItemName
        type: text
      - name: quantity
        field: ActualQty
        type: quantity
      - name: rate
        field: Rate
        type: rate
      - name: amount
        field: Amount
        type: amount
      - name: additional_amount
        field: AddlAmount
        type: amount
      - name: discount_amount
        field: Discount
        type: number
      - name: godown
        field: GodownName
        type: text
      - name: _godown
        field: $Guid:Godown:$GodownName
        type: text
      - name: tracking_number
        field: if ($$IsEmpty:$TrackingNumber or $$IsNotApplicable:$TrackingNumber) then "" else $TrackingNumber
        type: text
      - name: order_number
        field: if ($$IsEmpty:$OrderNo or $$IsNotApplicable:$OrderNo) then "" else $OrderNo
        type: text
      - name: order_duedate
        field: OrderDueDate
        type: date
  - name: trn_bill
    collection: Voucher.AllLedgerEntries.BillAllocations
    nature: Derived
    fetch:
      - AllLedgerEntries
    filters:
      - NOT $IsCancelled
      - NOT $IsOptional
    fields:
      - name: guid
        field: Guid
        type: text
      - name: ledger
        field: LedgerName
        type: text
      - name: _ledger
        field: $Guid:Ledger:$LedgerName
        type: text
      - name: name
        field: Name
        type: text
      - name: amount
        field: Amount
        type: amount
      - name: billtype
        field: BillType
        type: text
      - name: bill_credit_period
        field: $$Number:$BillCreditPeriod
        type: number
  - name: trn_batch
    collection: Voucher.AllInventoryEntries.BatchAllocations
    nature: Derived
    fetch:
      - AllInventoryEntries
    filters:
      - NOT $IsCancelled
      - NOT $IsOptional
    fields:
      - name: guid
        field: Guid
        type: text
      - name: item
        field: StockItemName
        type: text
      - name: _item
        field: if $$IsEmpty:$StockItemName then "" else $Guid:StockItem:$StockItemName
        type: text
      - name: name
        field: BatchName
        type: text
      - name: quantity
        field: ActualQty
        type: quantity
      - name: amount
        field: Amount
        type: amount
      - name: godown
        field: GodownName
        type: text
      - name: _godown
        field: if $$IsEmpty:$GodownName then "" else $Guid:Godown:$GodownName
        type: text
      - name: destination_godown
        field: DestinationGodownName
        type: text
      - name: _destination_godown
        field: if $$IsEmpty:$DestinationGodownName then "" else $Guid:Godown:$DestinationGodownName
        type: text
      - name: tracking_number
        field: if ($$IsEmpty:$TrackingNumber or $$IsNotApplicable:$TrackingNumber) then "" else $TrackingNumber
        type: text
